name: Feature proposal
description: Suggest a focused interoperability, fixture, or developer-experience improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A2A compatibility
        - MCP tools
        - ADK agent
        - LangGraph agent
        - Fixture data
        - Deployment
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or interoperability scenario
      description: Explain the concrete need before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: This does not require live booking, payment, or personal data.
          required: true
        - label: I searched existing issues and pull requests.
          required: true
