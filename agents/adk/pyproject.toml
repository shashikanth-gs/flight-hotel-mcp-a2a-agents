[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-travel-agent-adk"
version = "0.2.0"
description = "Standalone Google ADK A2A v1 reference agent using LiteLLM and NVIDIA NIM."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["a2a", "agents", "google-adk", "mcp", "nvidia-nim"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "a2a-sdk[http-server]==1.1.2",
  "google-adk==2.5.0",
  "litellm==1.94.0",
  "mcp==1.29.0",
  "opentelemetry-exporter-otlp-proto-http==1.42.1",
  "opentelemetry-instrumentation-asgi==0.63b1",
  "opentelemetry-sdk==1.42.1",
  "python-dotenv==1.1.1",
  "uvicorn>=0.30",
]

[project.scripts]
adk-a2a-agent = "adk_travel_agent.adk_agent:main"
adk-a2a-probe = "adk_travel_agent.probe:main"

[dependency-groups]
dev = [
  "httpx2>=2.0",
  "ruff==0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
