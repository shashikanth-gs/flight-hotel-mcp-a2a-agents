[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-travel-agent-langgraph"
version = "0.2.0"
description = "Standalone LangGraph A2A v1 reference agent using LiteLLM and NVIDIA NIM."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["a2a", "agents", "langgraph", "mcp", "nvidia-nim"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "a2a-sdk[http-server]==1.1.2",
  "fastapi>=0.133,<1",
  "langchain-litellm==0.7.2",
  "langchain-mcp-adapters==0.3.2",
  "langgraph==1.2.11",
  "litellm==1.101.0",
  "mcp==2.2.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "opentelemetry-instrumentation-asgi==0.65b0",
  "opentelemetry-sdk==1.44.0",
  "openinference-instrumentation-langchain==0.1.76",
  "python-dotenv==1.2.3",
  "uvicorn>=0.30",
]

[project.scripts]
langgraph-a2a-agent = "langgraph_travel_agent.langgraph_agent:main"
langgraph-a2a-probe = "langgraph_travel_agent.probe:main"

[dependency-groups]
dev = [
  "httpx2>=2.0",
  "ruff==0.16.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
