{{- if and (not (empty .Values.nvidia.apiKey)) (empty .Values.nvidia.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flight-hotel-mcp-a2a.nvidiaSecretName" . | quote }}
  labels:
    {{- include "flight-hotel-mcp-a2a.componentLabels" (dict "root" . "component" "nvidia") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.nvidia.secretKey | quote }}: {{ .Values.nvidia.apiKey | quote }}
{{- end }}
