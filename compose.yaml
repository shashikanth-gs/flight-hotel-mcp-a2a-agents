name: a2a-travel-playground

x-runtime-security: &runtime-security
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-agent-dependencies: &agent-dependencies
  flight-mcp:
    condition: service_healthy
  hotel-mcp:
    condition: service_healthy

services:
  flight-mcp:
    <<: *runtime-security
    build:
      context: .
      dockerfile: mcp-servers/Dockerfile
    command: flight-mcp
    environment:
      MCP_HOST: 0.0.0.0
      FLIGHT_MCP_PORT: 4301
      MCP_ALLOWED_HOSTS: flight-mcp:4301,localhost:4301,127.0.0.1:4301
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4301/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "4301:4301"

  hotel-mcp:
    <<: *runtime-security
    build:
      context: .
      dockerfile: mcp-servers/Dockerfile
    command: hotel-mcp
    environment:
      MCP_HOST: 0.0.0.0
      HOTEL_MCP_PORT: 4302
      MCP_ALLOWED_HOSTS: hotel-mcp:4302,localhost:4302,127.0.0.1:4302
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4302/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "4302:4302"

  adk-real:
    <<: *runtime-security
    build:
      context: .
      dockerfile: agents/adk/Dockerfile
    environment:
      AGENT_MODEL_MODE: real
      AGENT_HOST: 0.0.0.0
      ADK_AGENT_PORT: 4201
      ADK_PUBLIC_BASE_URL: http://localhost:4201
      FLIGHT_MCP_URL: http://flight-mcp:4301/mcp
      HOTEL_MCP_URL: http://hotel-mcp:4302/mcp
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REQUESTS: 1
      RATE_LIMIT_WINDOW_SECONDS: 60
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia_nim/nvidia/llama-3.3-nemotron-super-49b-v1.5}
      NVIDIA_NIM_API_BASE: ${NVIDIA_NIM_API_BASE:-https://integrate.api.nvidia.com/v1/}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
    depends_on: *agent-dependencies
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4201/.well-known/agent-card.json')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    ports:
      - "4201:4201"

  adk-stub:
    <<: *runtime-security
    build:
      context: .
      dockerfile: agents/adk/Dockerfile
    environment:
      AGENT_MODEL_MODE: stub
      AGENT_HOST: 0.0.0.0
      ADK_AGENT_PORT: 4201
      ADK_PUBLIC_BASE_URL: http://localhost:4203
      FLIGHT_MCP_URL: http://flight-mcp:4301/mcp
      HOTEL_MCP_URL: http://hotel-mcp:4302/mcp
      RATE_LIMIT_ENABLED: "false"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
    depends_on: *agent-dependencies
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4201/.well-known/agent-card.json')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    ports:
      - "4203:4201"

  langgraph-real:
    <<: *runtime-security
    build:
      context: .
      dockerfile: agents/langgraph/Dockerfile
    environment:
      AGENT_MODEL_MODE: real
      AGENT_HOST: 0.0.0.0
      LANGGRAPH_AGENT_PORT: 4202
      LANGGRAPH_PUBLIC_BASE_URL: http://localhost:4202
      FLIGHT_MCP_URL: http://flight-mcp:4301/mcp
      HOTEL_MCP_URL: http://hotel-mcp:4302/mcp
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REQUESTS: 1
      RATE_LIMIT_WINDOW_SECONDS: 60
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia_nim/nvidia/llama-3.3-nemotron-super-49b-v1.5}
      NVIDIA_NIM_API_BASE: ${NVIDIA_NIM_API_BASE:-https://integrate.api.nvidia.com/v1/}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
    depends_on: *agent-dependencies
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4202/.well-known/agent-card.json')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    ports:
      - "4202:4202"

  langgraph-stub:
    <<: *runtime-security
    build:
      context: .
      dockerfile: agents/langgraph/Dockerfile
    environment:
      AGENT_MODEL_MODE: stub
      AGENT_HOST: 0.0.0.0
      LANGGRAPH_AGENT_PORT: 4202
      LANGGRAPH_PUBLIC_BASE_URL: http://localhost:4204
      FLIGHT_MCP_URL: http://flight-mcp:4301/mcp
      HOTEL_MCP_URL: http://hotel-mcp:4302/mcp
      RATE_LIMIT_ENABLED: "false"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
    depends_on: *agent-dependencies
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4202/.well-known/agent-card.json')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    ports:
      - "4204:4202"
