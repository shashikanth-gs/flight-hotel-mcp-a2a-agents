[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-fixture-mcp-servers"
version = "0.2.0"
description = "Streamable HTTP MCP servers backed by deterministic travel fixture data."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["mcp", "travel", "fixtures", "testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "mcp==2.2.0",
  "uvicorn>=0.30",
]

[project.scripts]
flight-mcp = "travel_mcp.flight_server:main"
hotel-mcp = "travel_mcp.hotel_server:main"

[dependency-groups]
dev = ["ruff==0.16.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
travel_mcp = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
